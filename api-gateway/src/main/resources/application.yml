spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/users,/users/**
        
        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/products,/products/**
        
        - id: cart-service
          uri: lb://cart-service
          predicates:
            - Path=/cart,/cart/**
        
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/orders,/orders/**
        
        - id: inventory-service
          uri: lb://inventory-service
          predicates:
            - Path=/inventory,/inventory/**
        
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/payments,/payments/**

server:
  port: 8780

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
